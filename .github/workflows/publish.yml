name: Publish

# Builds the .deb on a version tag, attaches it to the GitHub release, then
# rebuilds the signed apt repository from every .deb ever released and
# publishes it to GitHub Pages.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  deb:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper devscripts dpkg-dev desktop-file-utils appstream python3

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artefacts
        run: |
          mkdir -p dist
          mv ../*.deb dist/
          ls -l dist

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.deb --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  apt:
    name: Publish apt repository
    needs: deb
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg

      - name: Collect every released .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/apt/pool/main
          for tag in $(gh release list --limit 200 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern '*.deb' --dir site/apt/pool/main --clobber || true
          done
          ls -l site/apt/pool/main

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set — apt would refuse the repository."
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "KEYID=$KEYID" >> "$GITHUB_ENV"
          gpg --batch --yes --export --armor "$KEYID" > site/apt/tlp-panel.asc

      - name: Build indices
        working-directory: site/apt
        run: |
          for arch in all amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$arch"
          done
          dpkg-scanpackages --multiversion pool/main \
            > dists/stable/main/binary-all/Packages
          for arch in amd64 arm64; do
            cp dists/stable/main/binary-all/Packages "dists/stable/main/binary-$arch/Packages"
          done
          for arch in all amd64 arm64; do
            gzip -9kf "dists/stable/main/binary-$arch/Packages"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="TLP Panel" \
            -o APT::FTPArchive::Release::Label="TLP Panel" \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Architectures="all amd64 arm64" \
            -o APT::FTPArchive::Release::Description="TLP Panel packages for Debian and Ubuntu" \
            release dists/stable > dists/stable/Release

      - name: Sign the release index
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: site/apt/dists/stable
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$KEYID" --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$KEYID" --clearsign --output InRelease Release

      - name: Landing page
        run: cp packaging/pages/index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: pages
        uses: actions/deploy-pages@v4
